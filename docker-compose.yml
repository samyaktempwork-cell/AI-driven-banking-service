services:
  db:
    image: postgres:15
    container_name: banking-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: banking
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  banking-service:
    build: .
    container_name: banking-service
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/banking
    ports:
      - "8000:8000"
    restart: always

volumes:
  postgres_data: